<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap">
<!-- Icons: Font Awesome 6 (wie die Web-UIs), als JS von cdnjs → <i class="fa-solid fa-…"> wird zu SVG -->
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/js/all.min.js"></script>
<style>
/* Vorschau-Template (.claude/skills/preview) – schnell erfassbar:
   Sprungleiste → Kopf (Auf einen Blick, Entschieden) → nummerierte Sections
   (Änderungen, Varianten, Bilder, Vorher/Nachher, Ablauf-Player, Live-Mockups, Notizen) → Fragen.
   Inhalt kommt komplett aus #spec (build.py), Aufbau siehe README.md.
   Bewusst anders als die Projekt-UIs (warmes Papier, Violett, Serif/Plex statt Navy/Cyan/Jakarta),
   Projekt-Inhalte (Screenshots, Mockups) stehen in .ui-frame mit Leiste „Projekt-UI“. */
:root {
  --bg: #ece7df; --surface: #fffdf9; --surface-2: #f1ece4; --ink: #1f1a14; --ink-2: #3d352c;
  --line: #d6cdbf; --accent: #6d28d9; --accent-soft: #efe7fd; --on-accent: #ffffff;
  --ok: #047857; --ok-soft: #d8f3e8; --warn: #92400e; --warn-soft: #fdf1dc;
  --bad: #b91c1c; --bad-soft: #fde4e4; --stage: #2a2520; --shadow: 0 1px 3px rgb(31 26 20 / 10%);
  --frame: #2a2520; --frame-ink: #f4efe7;
  --sans: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --serif: 'Source Serif 4', Georgia, 'Times New Roman', serif;
  --mono: 'IBM Plex Mono', ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #181614; --surface: #24211d; --surface-2: #2f2b26; --ink: #f1ece4; --ink-2: #d9d1c5;
    --line: #443e36; --accent: #b794f6; --accent-soft: #2e2542; --on-accent: #1a1030;
    --ok: #34d399; --ok-soft: #0d2c24; --warn: #fbbf24; --warn-soft: #2e2310;
    --bad: #f87171; --bad-soft: #3a1414; --stage: #0e0d0b; --shadow: none;
    --frame: #d9d1c5; --frame-ink: #1f1a14;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #181614; --surface: #24211d; --surface-2: #2f2b26; --ink: #f1ece4; --ink-2: #d9d1c5;
  --line: #443e36; --accent: #b794f6; --accent-soft: #2e2542; --on-accent: #1a1030;
  --ok: #34d399; --ok-soft: #0d2c24; --warn: #fbbf24; --warn-soft: #2e2310;
  --bad: #f87171; --bad-soft: #3a1414; --stage: #0e0d0b; --shadow: none;
  --frame: #d9d1c5; --frame-ink: #1f1a14;
}
* { box-sizing: border-box; }
html { background: var(--bg); scroll-behavior: smooth; scroll-padding-top: 72px; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 15px; line-height: 1.55; }
.wrap { max-width: 1400px; margin: 0 auto; padding: 28px 20px 80px; display: flex; flex-direction: column; gap: 40px; }
h1, h2, h3, h4 { margin: 0; line-height: 1.2; text-wrap: balance; }
h1 { font: 700 clamp(30px, 4vw, 42px)/1.15 var(--serif); letter-spacing: -0.01em; }
h2 { font: 700 clamp(20px, 2.4vw, 25px)/1.2 var(--serif); }
h3 { font-size: 16px; font-weight: 700; }
h4 { font: 600 12px var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-2); display: flex; align-items: center; gap: 8px; }
p { margin: 0; }
a { color: var(--accent); }
code { font-family: var(--mono); font-size: 0.88em; background: var(--surface-2); padding: 1px 5px; border-radius: 4px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
ul.li { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; color: var(--ink-2); }
ul.li li { display: flex; gap: 10px; align-items: baseline; }
ul.li li > .ic { flex: none; width: 16px; text-align: center; color: var(--ic, var(--ink-2)); }
ul.li b { color: var(--ink); }
.ic svg { width: 1em; }

/* Sprungleiste */
.topbar { position: sticky; top: 0; z-index: 10; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(6px); border-bottom: 1px solid var(--line); }
.topbar-in { max-width: 1400px; margin: 0 auto; padding: 8px 20px; display: flex; align-items: center; gap: 10px 16px; }
.topbar .t { font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 0 1 auto; }
.jump { display: flex; gap: 6px; overflow-x: auto; flex: 1 1 auto; min-width: 0; scrollbar-width: thin; }
.jump a { flex: none; display: inline-flex; align-items: center; gap: 7px; min-height: 32px; padding: 0 11px; border-radius: 8px; color: var(--ink); text-decoration: none; font: 600 13px var(--sans); border: 1px solid transparent; }
.jump a:hover { background: var(--surface-2); }
.jump a[aria-current="true"] { background: var(--accent-soft); border-color: var(--accent); }
.jump a .num { font: 600 11px var(--mono); color: var(--ink-2); }

.seg { flex: none; display: inline-flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; background: var(--surface); }
.seg button { min-height: 32px; padding: 0 11px; border: 0; background: transparent; color: var(--ink); font: 600 13px var(--sans); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }

/* Kopf */
.hero { display: flex; flex-direction: column; gap: 16px; }
.eyebrow { font: 600 12px var(--mono); letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent); display: flex; flex-wrap: wrap; gap: 6px 14px; }
.intro { max-width: 80ch; color: var(--ink-2); font-size: 16px; }
.glance { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); gap: 12px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: flex; gap: 12px; align-items: flex-start; box-shadow: var(--shadow); min-width: 0; }
.kpi .ic { flex: none; width: 36px; height: 36px; border-radius: 9px; display: grid; place-items: center; background: var(--tone-soft, var(--accent-soft)); color: var(--tone, var(--accent)); font-size: 16px; }
.kpi .v { font-weight: 800; font-size: 18px; line-height: 1.25; font-variant-numeric: tabular-nums; }
.kpi .l { font-size: 13px; color: var(--ink-2); }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); gap: 12px 20px; }
.box { border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; min-width: 0; background: var(--surface); border: 1px solid var(--line); }
.box.ok { background: var(--ok-soft); border-color: transparent; } .box.ok h4 { color: var(--ok); } .box.ok { --ic: var(--ok); }
.box.ask { background: var(--warn-soft); border-color: transparent; } .box.ask h4 { color: var(--warn); }

/* Töne (Badges, KPI, Karten) */
.t-info { --tone: var(--accent); --tone-soft: var(--accent-soft); }
.t-ok { --tone: var(--ok); --tone-soft: var(--ok-soft); }
.t-warn { --tone: var(--warn); --tone-soft: var(--warn-soft); }
.t-bad { --tone: var(--bad); --tone-soft: var(--bad-soft); }
.t-muted { --tone: var(--ink-2); --tone-soft: var(--surface-2); }
.badge { display: inline-flex; align-items: center; gap: 5px; font: 600 11.5px var(--mono); padding: 2px 8px; border-radius: 6px; background: var(--tone-soft, var(--surface-2)); color: var(--tone, var(--ink-2)); white-space: nowrap; }

/* Sections */
section.sec { display: flex; flex-direction: column; gap: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px 20px; box-shadow: var(--shadow); min-width: 0; }
@media (max-width: 520px) { section.sec { padding: 14px 12px 16px; } }
.sec-head { display: flex; align-items: center; gap: 12px; padding-bottom: 10px; border-bottom: 1px solid var(--line); }
.sec-head .n { flex: none; width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; background: var(--accent); color: var(--on-accent); font: 700 14px var(--mono); }
.sec-head .n .ic { font-size: 15px; }
.sec-head h2 { flex: 1 1 auto; min-width: 0; }
.sec-text { max-width: 80ch; color: var(--ink-2); }
.sec > ul.li.sec-text { gap: 4px; }

/* Änderungen */
.changes { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 330px), 1fr)); gap: 12px; }
.chg { background: var(--surface-2); border: 1px solid color-mix(in srgb, var(--tone, var(--accent)) 40%, var(--line)); border-radius: 10px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; box-shadow: var(--shadow); min-width: 0; }
.chg-top { display: flex; align-items: center; gap: 10px; }
.chg-top .ic { color: var(--tone, var(--accent)); font-size: 16px; width: 20px; text-align: center; flex: none; }
.chg-top b { flex: 1 1 auto; min-width: 0; }
.chg p { color: var(--ink-2); font-size: 14px; }
.chg .where { font: 500 12px var(--mono); color: var(--ink-2); display: flex; align-items: center; gap: 6px; overflow-wrap: anywhere; }

/* Varianten */
.opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 14px; }
.opt { background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; box-shadow: var(--shadow); min-width: 0; }
.opt.rec { border-color: color-mix(in srgb, var(--ok) 55%, var(--line)); }
.opt-top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.opt-top .k { flex: none; width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; background: var(--surface-2); font: 700 14px var(--mono); }
.opt.rec .opt-top .k { background: var(--ok); color: var(--on-accent); }
.opt-top b { flex: 1 1 auto; font-size: 16px; }
.opt p { color: var(--ink-2); font-size: 14px; }
.opt .shot { margin-top: 2px; }
.pc { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (max-width: 420px) { .pc { grid-template-columns: 1fr; } }

/* Bilder */
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, var(--min, 380px)), 1fr)); gap: 16px; }
figure { margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
figcaption { font-size: 13.5px; color: var(--ink-2); }
.shot { display: block; width: 100%; height: auto; border-radius: 10px; border: 1px solid var(--line); background: var(--stage); }
.pair-wrap { display: flex; flex-direction: column; gap: 8px; }
.pair { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 12px 16px; }
.pair .before h4 { color: var(--ink-2); }
.pair .after h4 { color: var(--ok); }
.pair-cap { font-size: 14px; color: var(--ink-2); }

/* Ablauf-Player */
.player { display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 20px; align-items: start; }
.nav { display: flex; flex-direction: column; gap: 14px; position: sticky; top: 64px; }
.nav-grp { display: flex; flex-direction: column; gap: 4px; }
.nav-grp h4 { padding-left: 4px; }
.nav button {
  display: flex; align-items: center; gap: 10px; width: 100%; min-height: 40px; padding: 6px 10px; text-align: left;
  border: 1px solid transparent; border-radius: 9px; background: transparent; color: var(--ink); font: 600 14px var(--sans); cursor: pointer;
}
.nav button:hover { background: var(--surface-2); }
.nav button[aria-current="true"] { background: var(--accent-soft); border-color: var(--accent); }
.nav button .n { margin-left: auto; font: 600 12px var(--mono); color: var(--ink-2); font-variant-numeric: tabular-nums; }
.stage { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.stage-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; }
.stage-head h3 { flex: 1 1 auto; font-size: 19px; }
.stage-head .sub { color: var(--ink-2); font-size: 14px; }
.img-box { border-radius: 12px; overflow: hidden; border: 1px solid var(--line); background: var(--stage); aspect-ratio: var(--ar, 16 / 9); }
.img-box a, .img-box img { display: block; width: 100%; height: 100%; }
.img-box img { object-fit: contain; }
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; }
.btn {
  min-height: 40px; padding: 0 16px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  font: 600 14px var(--sans); cursor: pointer; display: inline-flex; align-items: center; gap: 8px;
}
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.cap { flex: 1 1 300px; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.cap .k { font: 600 12px var(--mono); color: var(--accent); letter-spacing: 0.06em; font-variant-numeric: tabular-nums; }
.cap b { font-size: 16px; }
.cap span { color: var(--ink-2); font-size: 14px; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.thumbs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
.thumbs button { flex: none; width: 150px; padding: 0; border: 2px solid transparent; border-radius: 8px; background: var(--surface); cursor: pointer; display: flex; flex-direction: column; overflow: hidden; color: var(--ink); text-align: left; }
.thumbs button[aria-current="true"] { border-color: var(--accent); }
.thumbs img { display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: cover; }
.thumbs span { font: 600 11.5px var(--sans); padding: 4px 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* Rahmen um Projekt-Inhalte (Screenshots, Ablauf-Bild, Live-Mockup): Leiste „Projekt-UI“ trennt sie vom Template */
.ui-frame { display: flex; flex-direction: column; border: 2px solid var(--frame); border-radius: 12px; overflow: hidden; background: var(--frame); min-width: 0; }
.ui-frame::before { content: "Projekt-UI"; display: flex; align-items: center; min-height: 22px; padding: 0 10px; font: 600 11px var(--mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--frame-ink); }
.ui-frame[data-label]::before { content: "Projekt-UI · " attr(data-label); }
.ui-frame > .shot, .ui-frame > a > .shot, .ui-frame > .img-box, .ui-frame > .mock-frame { border: 0; border-radius: 0 0 10px 10px; }

/* Live-Mockups (HTML/CSS im iframe, mit den Tokens der Admin-Oberfläche (web/admin/css/tokens.css)) */
.mock-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.mock-frame { width: 100%; border: 1px solid var(--line); border-radius: 12px; background: var(--stage); display: block; }
.mock-note { font-size: 14px; color: var(--ink-2); flex: 1 1 260px; }

/* Fragen */
ol.qs { margin: 0; padding: 0; list-style: none; counter-reset: q; display: flex; flex-direction: column; gap: 10px; }
ol.qs li { counter-increment: q; display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 10px; color: var(--ink-2); }
ol.qs li::before { content: counter(q); width: 26px; height: 26px; border-radius: 7px; display: grid; place-items: center; background: var(--warn); color: var(--on-accent); font: 700 13px var(--mono); }
ol.qs b { color: var(--ink); }

/* Rückmeldung je Section → Kommentar an Claude (comments.sendToClaude) */
.fb { display: flex; flex-direction: column; gap: 8px; padding: 12px 14px; border: 1px dashed var(--line); border-radius: 12px; background: var(--surface-2); }
.fb-top { display: flex; align-items: center; gap: 8px; font: 600 13px var(--sans); color: var(--ink-2); }
.fb-top .ic { color: var(--accent); }
.fb textarea {
  width: 100%; min-height: 64px; resize: vertical; padding: 8px 10px; border: 1px solid var(--line); border-radius: 9px;
  background: var(--bg); color: var(--ink); font: 400 14px/1.5 var(--sans);
}
.fb textarea::placeholder { color: var(--ink-2); opacity: 0.8; }
.fb textarea:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 2px var(--accent-soft); }
.fb-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; }
.fb-bar .btn { min-height: 36px; padding: 0 14px; font-size: 13.5px; }
.fb-st { flex: 1 1 220px; min-width: 0; font-size: 13px; color: var(--ink-2); display: flex; align-items: center; gap: 6px; }
.fb-st.ok { color: var(--ok); } .fb-st.warn { color: var(--warn); } .fb-st.bad { color: var(--bad); }
.fb-bare { border: 0; padding: 0; background: none; }
.fb-all { border-style: solid; border-color: var(--accent); gap: 10px; }
.fb-all h4 { color: var(--accent); }
.fb-all .fb-bar { justify-content: flex-end; }
.fb-all .fb-bar .fb-st { order: -1; }

@media (max-width: 860px) {
  .player { grid-template-columns: minmax(0, 1fr); }
  .nav { position: static; flex-direction: row; overflow-x: auto; gap: 8px; }
  .nav-grp { flex: none; flex-direction: row; }
  .nav-grp h4 { display: none; }
  .nav button { width: auto; white-space: nowrap; }
  .topbar .t { display: none; }
}
@media (max-width: 520px) { .wrap, .topbar-in { padding-inline: 16px; } .seg .lbl { display: none; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } html { scroll-behavior: auto; } }
</style>
</head>
<body>
<nav class="topbar" aria-label="Abschnitte"><div class="topbar-in" id="topbar"></div></nav>
<main class="wrap" id="app"></main>
<script id="spec" type="application/json">/*__SPEC__*/null</script>
<script id="tokens" type="text/plain">/*__TOKENS__*/</script>
<script>
(() => {
  const S = JSON.parse(document.getElementById('spec').textContent);
  const TOKENS = document.getElementById('tokens').textContent;
  const app = document.getElementById('app');
  const topbar = document.getElementById('topbar');
  // Texte im Spec duerfen einfaches Inline-HTML enthalten (<b>, <code>, <br>) – den Inhalt schreibt nur Claude
  const h = (tag, attrs = {}, html) => {
    const e = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (v === undefined || v === null || v === false) continue;
      if (k === 'class') e.className = v; else if (k === 'style') e.style.cssText = v; else e.setAttribute(k, v === true ? '' : v);
    }
    if (html !== undefined) e.innerHTML = html;
    return e;
  };
  // Icon: Font-Awesome-Name ohne Praefix ("display", "fa-regular fa-clock" geht auch)
  const ic = (name, cls = '') => name ? `<span class="ic ${cls}" aria-hidden="true"><i class="${name.includes('fa-') ? name : 'fa-solid fa-' + name}"></i></span>` : '';
  const TONES = { new: ['info', 'plus', 'Neu'], changed: ['warn', 'pen', 'Geändert'], removed: ['bad', 'minus', 'Entfällt'],
    moved: ['info', 'arrows-up-down-left-right', 'Verschoben'], same: ['muted', 'equals', 'Unverändert'], fix: ['ok', 'wrench', 'Behoben'] };
  const badge = (t) => {
    // "Text" | ["Text", "ok|warn|bad|info|muted", "icon"?]
    const [txt, tone, icon] = Array.isArray(t) ? t : [t, '', ''];
    return `<span class="badge t-${tone || 'muted'}">${ic(icon)}${txt}</span>`;
  };
  // Listeneintrag: "Text" | {icon, text}
  const list = (items, defIcon) => {
    const u = h('ul', { class: 'li' });
    (items || []).forEach(t => { const o = typeof t === 'string' ? { text: t } : t; u.appendChild(h('li', {}, `${ic(o.icon || defIcon)}<span>${o.text}</span>`)); });
    return u;
  };
  const box = (cls, title, icon, items, defIcon) => { const b = h('div', { class: 'box ' + cls }); b.append(h('h4', {}, ic(icon) + title), list(items, defIcon)); return b; };
  const img = (key) => {
    const im = (S.images || {})[key];
    if (!im) console.warn('Bild fehlt im Spec:', key);
    return im || { src: '', w: 16, h: 9 };
  };
  const shot = (key, alt) => {
    const im = img(key);
    const a = h('a', { href: im.src, target: '_blank', rel: 'noopener', title: 'Groß in neuem Tab' });
    a.appendChild(h('img', { class: 'shot', src: im.src, width: im.w, height: im.h, alt: alt || '', loading: 'lazy' }));
    const fr = h('div', { class: 'ui-frame' }); fr.appendChild(a);
    return fr;
  };

  // ---- Theme (Seite + Live-Mockups) ----
  const themeBtns = [];
  const effTheme = () => document.documentElement.dataset.theme
    || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  const setTheme = (t) => {
    if (t === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.dataset.theme = t;
    themeBtns.forEach(b => b.setAttribute('aria-pressed', String(b.dataset.t === t)));
    try { localStorage.setItem('preview-theme', t); } catch (e) { /* ohne Storage */ }
    document.querySelectorAll('iframe.mock-frame').forEach(f => f.__apply && f.__apply());
  };

  // ---- Sprungleiste ----
  topbar.appendChild(h('span', { class: 't' }, S.short || S.title || ''));
  const jump = h('div', { class: 'jump' });
  topbar.appendChild(jump);
  const seg = h('div', { class: 'seg', role: 'group', 'aria-label': 'Darstellung' });
  [['auto', 'circle-half-stroke', 'Auto'], ['light', 'sun', 'Hell'], ['dark', 'moon', 'Dunkel']].forEach(([t, i, l]) => {
    const b = h('button', { type: 'button', 'data-t': t, 'aria-pressed': 'false', title: l, 'aria-label': l }, `${ic(i)}<span class="lbl">${l}</span>`);
    b.onclick = () => setTheme(t); themeBtns.push(b); seg.appendChild(b);
  });
  topbar.appendChild(seg);

  // ---- Kopf ----
  const hero = h('header', { class: 'hero' });
  const eb = [S.eyebrow, S.date && ic('calendar') + ' ' + S.date].filter(Boolean);
  if (eb.length) hero.appendChild(h('div', { class: 'eyebrow' }, eb.map(x => `<span>${x}</span>`).join('')));
  hero.appendChild(h('h1', {}, S.title || ''));
  // Intro nur als Stichpunkte (Inhalt, keine Bedienhinweise zur Seite)
  if (S.intro) { const u = list([].concat(S.intro), 'angle-right'); u.classList.add('intro'); hero.appendChild(u); }
  if (S.glance) {
    // Auf einen Blick: [{icon, value, label, tone}]
    const g = h('div', { class: 'glance' });
    S.glance.forEach(k => g.appendChild(h('div', { class: `kpi t-${k.tone || 'info'}` }, `${ic(k.icon || 'circle-info')}<div><div class="v">${k.value}</div><div class="l">${k.label || ''}</div></div>`)));
    hero.appendChild(g);
  }
  if (S.decided || S.how) {
    const c = h('div', { class: 'cols' });
    if (S.decided) c.appendChild(box('ok', S.decided_title || 'Schon entschieden', 'circle-check', S.decided, 'check'));
    if (S.how) c.appendChild(box('', S.how_title || 'So funktioniert es', 'gears', S.how, 'angle-right'));
    hero.appendChild(c);
  }
  app.appendChild(hero);

  // ---- Section-Typen ----
  const R = {
    changes(sec, el) {
      // items: [{kind: new|changed|removed|moved|same|fix, title, text, where, icon, tags}]
      const g = h('div', { class: 'changes' });
      sec.items.forEach(it => {
        const [tone, kIcon, kLbl] = TONES[it.kind] || TONES.changed;
        const c = h('article', { class: `chg t-${tone}` });
        c.innerHTML = `<div class="chg-top">${ic(it.icon || kIcon)}<b>${it.title}</b>${badge([kLbl, tone])}</div>`
          + (it.text ? `<p>${it.text}</p>` : '')
          + (it.where ? `<div class="where">${ic('location-dot')}${it.where}</div>` : '')
          + (it.tags ? `<div class="tags">${it.tags.map(badge).join('')}</div>` : '');
        g.appendChild(c);
      });
      el.appendChild(g);
    },
    options(sec, el) {
      // items: [{key: "A", title, text, img, pros[], cons[], recommended, tags}]
      const g = h('div', { class: 'opts' });
      sec.items.forEach((o, i) => {
        const c = h('article', { class: 'opt' + (o.recommended ? ' rec' : '') });
        c.appendChild(h('div', { class: 'opt-top' }, `<span class="k">${o.key || String.fromCharCode(65 + i)}</span><b>${o.title}</b>`
          + (o.recommended ? badge(['Empfohlen', 'ok', 'star']) : '')));
        if (o.img) c.appendChild(shot(o.img, o.title));
        if (o.text) c.appendChild(h('p', {}, o.text));
        if (o.pros || o.cons) {
          const pc = h('div', { class: 'pc' });
          if (o.pros) { const d = h('div', { style: '--ic: var(--ok)' }); d.appendChild(list(o.pros, 'plus')); pc.appendChild(d); }
          if (o.cons) { const d = h('div', { style: '--ic: var(--bad)' }); d.appendChild(list(o.cons, 'minus')); pc.appendChild(d); }
          c.appendChild(pc);
        }
        if (o.tags) c.appendChild(h('div', { class: 'tags' }, o.tags.map(badge).join('')));
        g.appendChild(c);
      });
      el.appendChild(g);
    },
    figures(sec, el) {
      const g = h('div', { class: 'grid', style: sec.min ? `--min:${sec.min}px` : '' });
      sec.items.forEach(it => {
        const f = h('figure');
        f.appendChild(shot(it.img, it.alt || it.caption));
        if (it.caption) f.appendChild(h('figcaption', {}, it.caption));
        g.appendChild(f);
      });
      el.appendChild(g);
    },
    compare(sec, el) {
      sec.pairs.forEach(p => {
        const wrap = h('div', { class: 'pair-wrap' });
        if (p.title) wrap.appendChild(h('h3', {}, p.title));
        const pair = h('div', { class: 'pair' });
        [['before', p.before, p.before_label || 'Vorher', 'clock-rotate-left'], ['after', p.after, p.after_label || 'Nachher', 'wand-magic-sparkles']].forEach(([cls, key, lbl, i]) => {
          const f = h('figure', { class: cls });
          f.append(h('h4', {}, ic(i) + lbl), shot(key, `${lbl}: ${p.title || ''}`));
          pair.appendChild(f);
        });
        wrap.appendChild(pair);
        if (p.caption) wrap.appendChild(h('p', { class: 'pair-cap' }, p.caption));
        el.appendChild(wrap);
      });
    },
    player(sec, el) {
      const flows = sec.flows;
      const pl = h('div', { class: 'player' });
      const nav = h('nav', { class: 'nav', 'aria-label': sec.title || 'Abläufe' });
      const stage = h('div', { class: 'stage' });
      const head = h('div', { class: 'stage-head' }); const ttl = h('h3'); const sub = h('span', { class: 'sub' }); head.append(ttl, sub);
      const ib = h('div', { class: 'img-box' }); const ia = h('a', { target: '_blank', rel: 'noopener' }); const ii = h('img', { alt: '' });
      ia.appendChild(ii); ib.appendChild(ia);
      const bar = h('div', { class: 'bar' });
      const prev = h('button', { class: 'btn', type: 'button', 'aria-label': 'Vorheriger Schritt' }, ic('arrow-left') + 'Zurück');
      const next = h('button', { class: 'btn primary', type: 'button', 'aria-label': 'Nächster Schritt' }, 'Weiter' + ic('arrow-right'));
      const cap = h('div', { class: 'cap' }); const ck = h('span', { class: 'k' }); const cb = h('b'); const cd = h('span'); const ct = h('div', { class: 'tags' });
      cap.append(ck, cb, cd, ct); bar.append(prev, cap, next);
      const thumbs = h('div', { class: 'thumbs', 'aria-label': 'Schritte' });
      const ibf = h('div', { class: 'ui-frame' }); ibf.appendChild(ib);
      stage.append(head, ibf, bar, thumbs);
      pl.append(nav, stage); el.appendChild(pl);

      const groups = [];
      flows.forEach((f, i) => { const g = f.group || ''; let G = groups.find(x => x.g === g); if (!G) groups.push(G = { g, items: [] }); G.items.push(i); });
      const navBtns = [];
      groups.forEach(G => {
        const grp = h('div', { class: 'nav-grp' });
        if (G.g) grp.appendChild(h('h4', {}, G.g));
        G.items.forEach(i => {
          const b = h('button', { type: 'button' }, `${ic(flows[i].icon)}<span>${flows[i].title}</span><span class="n">${flows[i].steps.length}</span>`);
          b.onclick = () => show(i, 0); navBtns[i] = b; grp.appendChild(b);
        });
        nav.appendChild(grp);
      });
      let fi = 0, si = 0;
      const show = (f, s) => {
        fi = f; si = s; const F = flows[f]; const St = F.steps[s]; const im = img(St.img);
        navBtns.forEach((b, i) => b.setAttribute('aria-current', String(i === f)));
        ttl.innerHTML = F.title; sub.innerHTML = F.sub || '';
        ib.style.setProperty('--ar', `${im.w} / ${im.h}`);
        ia.href = im.src; ii.src = im.src; ii.alt = St.t || '';
        ck.textContent = `SCHRITT ${s + 1} / ${F.steps.length}`;
        cb.innerHTML = St.t || ''; cd.innerHTML = St.de || '';
        ct.innerHTML = (St.tags || []).map(badge).join('');
        prev.disabled = f === 0 && s === 0;
        next.disabled = f === flows.length - 1 && s === F.steps.length - 1;
        thumbs.replaceChildren(...F.steps.map((x, k) => {
          const b = h('button', { type: 'button', 'aria-current': String(k === s), title: x.t || '' });
          b.append(h('img', { src: img(x.img).src, alt: '', loading: 'lazy' }), h('span', {}, `${k + 1} · ${x.t || ''}`));
          b.onclick = () => show(f, k); return b;
        }));
        thumbs.children[s]?.scrollIntoView({ block: 'nearest', inline: 'nearest' });
      };
      const step = (d) => {
        let f = fi, s = si + d;
        if (s >= flows[f].steps.length) { if (f < flows.length - 1) { f++; s = 0; } else return; }
        if (s < 0) { if (f > 0) { f--; s = flows[f].steps.length - 1; } else return; }
        show(f, s);
      };
      prev.onclick = () => step(-1); next.onclick = () => step(1);
      let hover = false; pl.onmouseenter = () => { hover = true; }; pl.onmouseleave = () => { hover = false; };
      document.addEventListener('keydown', e => {
        if (!hover || e.target.closest('input, textarea')) return;
        if (e.key === 'ArrowRight') { step(1); e.preventDefault(); } else if (e.key === 'ArrowLeft') { step(-1); e.preventDefault(); }
      });
      show(0, 0);
    },
    mockup(sec, el) {
      // variants: [{label, html, css, height, note}] – mit den Tokens der Admin-Oberfläche (--bg, --surface, --border, --text, --primary …), folgt Hell/Dunkel
      const vars = sec.variants;
      const bar = h('div', { class: 'mock-bar' });
      const seg2 = h('div', { class: 'seg', role: 'group', 'aria-label': 'Variante' });
      const note = h('p', { class: 'mock-note' });
      const fr = h('iframe', { class: 'mock-frame', title: sec.title || 'Mockup', loading: 'lazy' });
      let cur = 0; const btns = [];
      const load = () => {
        const v = vars[cur];
        fr.style.height = (v.height || sec.height || 420) + 'px';
        note.innerHTML = v.note || '';
        btns.forEach((b, i) => b.setAttribute('aria-pressed', String(i === cur)));
        const base = `<style>${TOKENS}</style><style>html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font,system-ui,sans-serif);font-size:15px}${sec.css || ''}${v.css || ''}</style>`;
        const fa = '<script defer src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/js/all.min.js"><\/script>';
        fr.srcdoc = `<!doctype html><html><head><meta charset="utf-8">${fa}${base}</head><body>${v.html}</body></html>`;
      };
      fr.__apply = () => { try { fr.contentDocument.documentElement.dataset.theme = effTheme(); } catch (e) { /* noch nicht geladen */ } };
      fr.addEventListener('load', fr.__apply);
      vars.forEach((v, i) => { const b = h('button', { type: 'button' }, v.label); b.onclick = () => { cur = i; load(); }; btns.push(b); seg2.appendChild(b); });
      if (vars.length > 1) bar.appendChild(seg2);
      const frw = h('div', { class: 'ui-frame', 'data-label': 'Mockup' }); frw.appendChild(fr);
      bar.appendChild(note); el.append(bar, frw); load();
    },
    notes(sec, el) { el.appendChild(list(sec.items, sec.item_icon || 'angle-right')); },
  };

  // ---- Rückmeldung je Section → Kommentar an Claude ----
  // Senden per claude.use('comments').sendToClaude (Artifact mit capabilities {comments: {}}),
  // sonst nur Kopieren. Entwürfe bleiben pro Browser erhalten (localStorage).
  const FB = S.feedback !== false;
  const plain = (html) => { const d = document.createElement('div'); d.innerHTML = html || ''; return d.textContent.replace(/\s+/g, ' ').trim(); };
  const docName = plain(S.title || S.short || 'Vorschau');
  const fbKey = 'preview-fb:' + docName;
  let drafts = {}; try { drafts = JSON.parse(localStorage.getItem(fbKey) || '{}'); } catch (e) { /* ohne Storage */ }
  const saveDrafts = () => { try { localStorage.setItem(fbKey, JSON.stringify(drafts)); } catch (e) { /* ohne Storage */ } };
  const fbs = [];          // {key, label, ta, send, st, el}
  let cm = null, canSend = 'off', allBox = null;
  const LIMIT = 4000;      // sendToClaude: max. 4 KiB UTF-8
  const bytes = (s) => new TextEncoder().encode(s).length;
  const REASON = {
    writers_only: 'Senden an Claude geht nur für Bearbeiter dieser Vorschau – Text kopieren und im Chat einfügen',
    no_session: 'Gerade beobachtet keine Claude-Sitzung diese Vorschau – Chat offen lassen oder Text kopieren und im Chat einfügen',
    off: 'Senden an Claude ist hier nicht verfügbar (z. B. Datei lokal geöffnet) – Text kopieren und im Chat einfügen',
  };
  const ERR = {
    consent_required: ['warn', 'Nicht gesendet: erst das Kommentieren für diese Seite erlauben, dann erneut senden'],
    forbidden: ['warn', 'Kommentieren über die Seite ist hier aus – Text kopieren und im Chat einfügen'],
    invalid: ['bad', `Nicht gesendet: Text zu lang oder ungültig (max. ca. ${LIMIT} Zeichen) – kürzen oder einzeln senden`],
    rate_limited: ['warn', 'Nicht gesendet: zu viele Nachrichten kurz hintereinander – kurz warten, dann erneut senden'],
    claude_unavailable: ['warn', 'Nicht gesendet: keine Claude-Sitzung erreichbar – Text kopieren und im Chat einfügen'],
  };
  const setSt = (st, tone, icon, text) => { st.className = 'fb-st' + (tone ? ' ' + tone : ''); st.innerHTML = text ? ic(icon) + '<span></span>' : ''; if (text) st.lastChild.textContent = text; };
  const filled = () => fbs.filter(f => f.ta.value.trim());
  const msgOne = (f) => `Änderungswunsch aus der Vorschau „${docName}“ – bitte umsetzen:\n\n${f.label}:\n${f.ta.value.trim()}`;
  const msgAll = () => `Änderungswünsche aus der Vorschau „${docName}“ – bitte umsetzen:\n\n`
    + filled().map(f => `${f.label}:\n${f.ta.value.trim()}`).join('\n\n');
  const refresh = () => {
    const ok = canSend === 'available';
    const why = ok ? '' : (REASON[canSend] || REASON.off);
    fbs.forEach(f => {
      const has = !!f.ta.value.trim();
      f.send.disabled = !ok || !has;
      f.send.title = !ok ? why : has ? 'Als Kommentar an Claude senden (Strg+Enter)' : 'Erst eine Änderung eintragen';
      f.copy.disabled = !has;
    });
    if (allBox) {
      const n = filled().length;
      allBox.send.disabled = !ok || !n;
      allBox.send.querySelector('.n').textContent = n;
      allBox.send.title = !ok ? why : n ? 'Alle Einträge als eine Nachricht an Claude senden' : 'Noch keine Änderung eingetragen';
      allBox.copy.disabled = !n;
      if (!ok && !allBox.st.textContent) setSt(allBox.st, '', 'circle-info', why);
      if (ok && allBox.st.dataset.reason) setSt(allBox.st, '', '', '');
      allBox.st.dataset.reason = ok ? '' : '1';
    }
  };
  const recheck = () => {
    if (!cm) return;
    cm.canSendToClaude().then(v => { canSend = v; }, () => { canSend = 'off'; }).then(refresh);
  };
  const copyText = async (text, st) => {
    try { await navigator.clipboard.writeText(text); } catch (e) {
      const t = h('textarea', { style: 'position:fixed;opacity:0' }); t.value = text; document.body.appendChild(t); t.select();
      const done = document.execCommand('copy'); t.remove();
      if (!done) { setSt(st, 'bad', 'triangle-exclamation', 'Kopieren nicht möglich – Text im Feld markieren und mit Strg+C kopieren'); return; }
    }
    setSt(st, 'ok', 'check', 'Kopiert – im Chat einfügen');
  };
  const send = async (items, text, anchorEl, st, btn) => {
    if (!cm) return;
    if (bytes(text) > LIMIT) { setSt(st, ERR.invalid[0], 'triangle-exclamation', ERR.invalid[1]); return; }
    btn.disabled = true; setSt(st, '', 'spinner fa-spin', 'Wird gesendet …');
    try {
      const anchor = await cm.anchorFor(anchorEl);
      await cm.sendToClaude({ anchor, text });
      items.forEach(f => { f.ta.value = ''; delete drafts[f.key]; if (f.st !== st) setSt(f.st, 'ok', 'check', 'Mit „Alle senden“ gesendet'); });
      saveDrafts();
      setSt(st, 'ok', 'paper-plane', 'Gesendet – Claude antwortet als Kommentar in dieser Vorschau');
    } catch (e) {
      const [tone, txt] = ERR[e && e.code] || ['bad', `Nicht gesendet (${(e && e.code) || 'Fehler'}) – erneut senden oder Text kopieren`];
      setSt(st, tone, 'triangle-exclamation', txt);
      if (e && e.code === 'claude_unavailable') { recheck(); return; }
    }
    refresh();
  };
  // Eingabe unten in einer Section; key = Entwurfsschlüssel, label = Kopfzeile in der Nachricht
  const fbBox = (key, label, placeholder, head = 'Änderung für diesen Abschnitt', own = true) => {
    const el = h('div', { class: 'fb' + (own ? '' : ' fb-bare') });
    el.appendChild(h('div', { class: 'fb-top' }, ic('comment-dots') + head));
    const ta = h('textarea', { rows: 2, maxlength: 3000, placeholder: placeholder || 'z. B. Button größer, Text kürzer, Variante B nehmen …', 'aria-label': 'Änderung für ' + label });
    ta.value = drafts[key] || '';
    const bar = h('div', { class: 'fb-bar' });
    const st = h('span', { class: 'fb-st', role: 'status', 'aria-live': 'polite' });
    const copy = h('button', { class: 'btn', type: 'button' }, ic('copy') + 'Kopieren');
    const snd = h('button', { class: 'btn primary', type: 'button' }, ic('paper-plane') + 'An Claude senden');
    bar.append(st, copy, snd); el.append(ta);
    if (own) el.appendChild(bar);   // ohne eigene Knöpfe: nur über „Alle senden“
    const f = { key, label, ta, send: snd, copy, st, el };
    ta.addEventListener('input', () => { drafts[key] = ta.value; if (!ta.value) delete drafts[key]; saveDrafts(); setSt(st, '', '', ''); refresh(); });
    ta.addEventListener('focus', recheck);
    ta.addEventListener('keydown', e => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey) && !snd.disabled) { e.preventDefault(); snd.click(); } });
    copy.onclick = () => copyText(msgOne(f), st);
    snd.onclick = () => send([f], msgOne(f), el, st, snd);
    fbs.push(f);
    return el;
  };

  // ---- Sections (nummeriert, Icon, Sprungleiste) ----
  const links = [];
  (S.sections || []).forEach((sec, i) => {
    const id = sec.id || `s${i + 1}`;
    const el = h('section', { class: 'sec', id, 'aria-labelledby': id + '-h' });
    const num = sec.icon ? ic(sec.icon) : String(i + 1);
    el.appendChild(h('div', { class: 'sec-head' }, `<span class="n">${num}</span><h2 id="${id}-h">${sec.title || ''}</h2>${sec.badge ? badge(sec.badge) : ''}`));
    if (sec.text) { const u = list([].concat(sec.text), 'angle-right'); u.classList.add('sec-text'); el.appendChild(u); }
    (R[sec.type] || (() => el.appendChild(h('p', {}, `Unbekannter Section-Typ: ${sec.type}`))))(sec, el);
    if (FB && sec.feedback !== false) el.appendChild(fbBox(id, `Abschnitt ${i + 1} „${plain(sec.title || sec.nav || id)}“`, sec.feedback_hint));
    app.appendChild(el);
    const a = h('a', { href: '#' + id }, `${sec.icon ? ic(sec.icon) : `<span class="num">${i + 1}</span>`}${sec.nav || sec.title || id}`);
    jump.appendChild(a); links.push([a, el]);
  });
  if (S.questions) {
    const q = h('section', { class: 'box ask', id: 'fragen' });
    q.appendChild(h('h4', {}, ic('circle-question') + (S.questions_title || 'Fragen an dich')));
    const ol = h('ol', { class: 'qs' }); S.questions.forEach(t => ol.appendChild(h('li', {}, `<span>${t}</span>`)));
    q.appendChild(ol);
    if (FB) q.appendChild(fbBox('fragen', 'Antworten auf „Fragen an dich“', 'z. B. 1: Variante A · 2: ja · 3: erst später', 'Deine Antworten'));
    app.appendChild(q);
    const a = h('a', { href: '#fragen' }, ic('circle-question') + `Fragen <span class="num">${S.questions.length}</span>`);
    jump.appendChild(a); links.push([a, q]);
  }
  if (FB) {
    // Sammelkasten: allgemeine Anmerkung + alle Einträge als eine Nachricht senden
    const el = h('section', { class: 'fb fb-all', id: 'senden', 'aria-labelledby': 'senden-h' });
    el.appendChild(h('h4', { id: 'senden-h' }, ic('paper-plane') + 'Rückmeldung an Claude'));
    const gen = fbBox('allgemein', 'Allgemein', 'Allgemeine Anmerkungen zur ganzen Vorschau …', 'Allgemein', false);
    const bar = h('div', { class: 'fb-bar' });
    const st = h('span', { class: 'fb-st', role: 'status', 'aria-live': 'polite' });
    const copy = h('button', { class: 'btn', type: 'button' }, ic('copy') + 'Alles kopieren');
    const snd = h('button', { class: 'btn primary', type: 'button' }, ic('paper-plane') + '<span>Alle senden (<span class="n">0</span>)</span>');
    bar.append(st, copy, snd); el.append(gen, bar); app.appendChild(el);
    allBox = { send: snd, copy, st };
    copy.onclick = () => copyText(msgAll(), st);
    snd.onclick = () => send(filled(), msgAll(), el, st, snd);
    const a = h('a', { href: '#senden' }, ic('paper-plane') + 'Senden');
    jump.appendChild(a); links.push([a, el]);
    refresh();
    // claude.use kommt vom claude.ai-Viewer; lokal geöffnet bleibt nur Kopieren
    if (window.claude && typeof window.claude.use === 'function') {
      window.claude.use('comments').then(c => { cm = c; recheck(); }, () => {});
    }
  }
  // aktuelle Section in der Sprungleiste markieren
  if ('IntersectionObserver' in window) {
    const io = new IntersectionObserver(es => es.forEach(e => {
      if (!e.isIntersecting) return;
      links.forEach(([a, el]) => a.setAttribute('aria-current', String(el === e.target)));
    }), { rootMargin: '-80px 0px -60% 0px' });
    links.forEach(([, el]) => io.observe(el));
  }

  let saved = 'auto'; try { saved = localStorage.getItem('preview-theme') || 'auto'; } catch (e) { /* ohne Storage */ }
  setTheme(saved);
})();
</script>
</body>
</html>
