[pytest]
testpaths = tests
# Fremde pytest-Plugins aus einer eventuell aktiven ROS-/Systemumgebung abschalten (Projekt ist eigenständig)
addopts = -p no:launch_testing -p no:launch_ros -p no:ament_copyright -p no:ament_xmllint -p no:ament_pep257
          -p no:ament_flake8 -p no:ament_lint -p no:dash -p no:colcon_core_warnings_stderr -p no:cacheprovider
filterwarnings =
    ignore::DeprecationWarning
