# Tests unter Linux und Windows: pytest + echter Start über run.sh/run.bat (lokale Demoversion ohne extra Server).
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHON: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # Video- und PDF-Import wie beim Anwender (README: ffmpeg, poppler)
      - name: ffmpeg und poppler
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then choco install -y --no-progress ffmpeg poppler
          else sudo apt-get update -q && sudo apt-get install -y -q ffmpeg poppler-utils; fi

      # Fehlschläge zusätzlich als Annotation: ohne Anmeldung sichtbar, Logs nicht
      - name: pytest
        shell: bash
        run: |
          python -m pip install -q -r requirements-dev.txt
          rc=0; python -m pytest server/tests -q -rfEs > pytest.log 2>&1 || rc=$?
          tail -60 pytest.log
          grep -E '^(FAILED|ERROR) ' pytest.log | sed 's/^/::error::/' || true
          exit $rc

      # Startskript wie beim Anwender: legt .venv an, installiert, startet; Admin und Player müssen antworten
      - name: Start mit run.sh
        if: runner.os != 'Windows'
        shell: bash
        env:
          STELECMS_PORT: "18090"   # nur hier: Tests erwarten den Standardport
        run: |
          export STELECMS_DATA="$RUNNER_TEMP/stele-data"
          ./run.sh > "$RUNNER_TEMP/stele.log" 2>&1 &
          pid=$!
          for _ in $(seq 180); do curl -fs -o /dev/null "http://127.0.0.1:$STELECMS_PORT/admin/" && break; sleep 1; done
          rc=0
          for p in /admin/ /player/; do
            curl -fs -o /dev/null "http://127.0.0.1:$STELECMS_PORT$p" || { echo "::error::$p antwortet nicht"; rc=1; }
          done
          kill "$pid" || true
          cat "$RUNNER_TEMP/stele.log"
          [ $rc = 0 ] || tail -5 "$RUNNER_TEMP/stele.log" | sed 's/^/::error::/'
          exit $rc

      - name: Start mit run.bat
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          STELECMS_PORT: "18090"   # nur hier: Tests erwarten den Standardport
        run: |
          $env:STELECMS_DATA = "$env:RUNNER_TEMP\stele-data"
          $log = "$env:RUNNER_TEMP\stele.log"
          $p = Start-Process cmd.exe -ArgumentList '/c', 'run.bat' -PassThru -NoNewWindow `
            -RedirectStandardOutput $log -RedirectStandardError "$log.err"
          $base = "http://127.0.0.1:$env:STELECMS_PORT"
          for ($i = 0; $i -lt 180; $i++) {
            try { Invoke-WebRequest "$base/admin/" -UseBasicParsing -TimeoutSec 2 | Out-Null; break } catch { Start-Sleep 1 }
          }
          $rc = 0
          foreach ($path in '/admin/', '/player/') {
            try { Invoke-WebRequest "$base$path" -UseBasicParsing -TimeoutSec 5 | Out-Null }
            catch { Write-Output "::error::$path antwortet nicht"; $rc = 1 }
          }
          taskkill /T /F /PID $p.Id | Out-Null
          Get-Content $log, "$log.err"
          if ($rc) { Get-Content $log, "$log.err" -Tail 5 | ForEach-Object { "::error::$_" } }
          exit $rc
